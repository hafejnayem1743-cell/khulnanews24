    <script>
      (function() {
        try {
          var rawTheme = localStorage.getItem('khulna_theme_mode_v1');
          if (rawTheme) {
            var theme = JSON.parse(rawTheme);
            if (theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.setAttribute('data-theme', 'light');
              document.documentElement.style.colorScheme = 'light';
            }
          }
        } catch(e) {}

        // Initialize language cookie before translate script loads
        try {
          var savedLang = localStorage.getItem('khulna_selected_language');
          if (savedLang && savedLang !== 'bn') {
            var cookieVal = '/bn/' + savedLang;
            document.cookie = 'googtrans=' + cookieVal + '; path=/;';
            if (window.location.hostname) {
              document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + window.location.hostname + ';';
            }
          }
        } catch(e) {}
      })();

      function googleTranslateElementInit() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'bn',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch(e) {}
      }
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0f172a] text-[#1e293b] dark:text-[#f1f5f9] transition-colors duration-200 antialiased selection:bg-red-600 selection:text-white">
    <div id="google_translate_element" style="display: none !important;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </body>
